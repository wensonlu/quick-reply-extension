<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="50%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#heroGrad)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="0" x2="1280" y2="800"/>
    <line x1="160" y1="0" x2="1280" y2="700"/>
    <line x1="320" y1="0" x2="1280" y2="600"/>
    <line x1="480" y1="0" x2="1280" y2="500"/>
  </g>

  <!-- Accent bar at top -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accentBar)"/>

  <!-- App icon (large) -->
  <g transform="translate(640, 300)">
    <!-- Shadow -->
    <rect x="-64" y="-64" width="128" height="128" rx="28" fill="#000" opacity="0.25" transform="translate(8, 12)"/>
    <!-- Icon bg -->
    <rect x="-60" y="-60" width="120" height="120" rx="26" fill="#2563eb"/>
    <!-- Bolt -->
    <path d="M -12 -48 L -32 -12 L -18 -12 L -26 12 L 12 -20 L -2 -20 L 8 -48 Z" fill="#ffffff"/>
    <!-- Orange dot -->
    <circle cx="36" cy="-44" r="7" fill="#f97316"/>
  </g>

  <!-- Title -->
  <text x="640" y="440" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="48" font-weight="700" fill="#ffffff" letter-spacing="4">
    快捷话术
  </text>

  <!-- Tagline -->
  <text x="640" y="490" text-anchor="middle" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#93c5fd" letter-spacing="2">
    输入 / 触发词 → 一键填充完整话术
  </text>

  <!-- Features row -->
  <g transform="translate(640, 580)">
    <rect x="-300" y="-30" width="180" height="60" rx="12" fill="#ffffff" opacity="0.08"/>
    <text x="-210" y="2" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" fill="#bfdbfe">⚡ 快捷触发</text>
    <text x="-210" y="20" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#60a5fa">输入关键词自动展开</text>

    <rect x="-100" y="-30" width="180" height="60" rx="12" fill="#ffffff" opacity="0.08"/>
    <text x="-10" y="2" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" fill="#bfdbfe">📦 行业模板</text>
    <text x="-10" y="20" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#60a5fa">电商客服话术即装即用</text>

    <rect x="100" y="-30" width="180" height="60" rx="12" fill="#ffffff" opacity="0.08"/>
    <text x="190" y="2" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="15" fill="#bfdbfe">🔒 本地运行</text>
    <text x="190" y="20" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="11" fill="#60a5fa">数据不上传，零服务器</text>
  </g>

  <!-- Bottom text -->
  <text x="640" y="700" text-anchor="middle" font-family="-apple-system, 'PingFang SC', sans-serif" font-size="13" fill="#3b82f6" opacity="0.7">
    Chrome 扩展 · 免费使用 · Chrome Web Store
  </text>
</svg>
